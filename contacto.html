<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Shinny Printing Lab</title>
    <style>
        body {
            background-color: #12181F;
            color: #F5F1EA;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #12181F;
            padding: 10px 0;
        }
        nav a {
            color: #F5F1EA;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }
        nav a.active {
            color: #FF8A3D;
        }
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0 60px;
        }
        form {
            background-color: #12181F;
            padding: 20px;
            width: 80%;
            max-width: 400px;
        }
        .field {
            width: 100%;
            text-align: center;
            margin: 10px 0;
            border: 2px solid #3DDCFF;
            box-shadow: 0 0 8px #3DDCFF, 0 0 16px rgba(61,220,255,0.5);
            border-radius: 5px;
        }
        input, textarea {
            width: 90%;
            padding: 10px;
            background-color: #12181F;
            color: #F5F1EA;
            border: none;
            box-shadow: none;
            border-radius: 5px;
        }
        textarea {
            resize: none;
            height: 100px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #FF8A3D;
            color: #F5F1EA;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #FF5722;
        }
        h1 {
            margin-bottom: 20px; /* Aumentar el espacio debajo del h1 */
        }
        p {
            margin-top: 10px; /* Mantener el espacio arriba del p */
        }
        .success {
            color: #4FC3A1;
            font-size: 16px;
            margin-top: 20px;
            text-align: center;
        }
        .error {
            color: red;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="cotiza.html">Cotiza tu pieza</a>
            <a href="contacto.html" class="active">Contacto</a>
        
            <a href="/polish/">Polish</a>
            <a href="tienda.html">Tienda en linea</a>
        </nav>
    </header>
    <div style="text-align:center; padding: 20px 20px 0;">
    <h1>¡Pregunta lo que quieras!</h1>
    <p>¿Tienes dudas o necesitas una cotización? Escríbenos y nuestro equipo te responderá rapidísimo. ¡Estamos para ayudarte!</p>
    </div>
    <div class="form-container">
        <form id="contactoForm">
            <div class="field">
                <input type="text" name="nombre" placeholder="Nombre" required>
            </div>
            <div class="field">
                <input type="email" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="field">
                <textarea name="mensaje" placeholder="Mensaje" required></textarea>
            </div>
            <button type="submit">Enviar</button>
        </form>
        <div id="message" style="display:none;"></div>
    </div>
    <script>
        const form = document.getElementById('contactoForm');
        const submitButton = form.querySelector('button');
        const messageEl = document.getElementById('message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const payload = {
                nombre: form.nombre.value,
                email: form.email.value,
                mensaje: form.mensaje.value,
            };

            submitButton.disabled = true;
            submitButton.textContent = 'Enviando...';

            try {
                const response = await fetch('/api/leads/contacto/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (response.ok) {
                    form.style.display = 'none';
                    messageEl.className = 'success';
                    messageEl.textContent = '¡Listo! Recibimos tu mensaje, te contactaremos pronto.';
                    messageEl.style.display = 'block';
                } else {
                    messageEl.className = 'error';
                    messageEl.textContent = 'No se pudo enviar tu mensaje. Inténtalo de nuevo.';
                    messageEl.style.display = 'block';
                }
            } catch (error) {
                messageEl.className = 'error';
                messageEl.textContent = 'Error de red. Inténtalo de nuevo.';
                messageEl.style.display = 'block';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Enviar';
            }
        });
    </script>
</body>
</html>

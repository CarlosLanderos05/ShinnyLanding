<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotiza tu pieza - Shinny Printing Lab</title>
    <style>
        body {
            background-color: #12181F;
            color: #F5F1EA;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #12181F;
            padding: 10px 0;
        }
        nav a {
            color: #F5F1EA;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }
        nav a.active {
            color: #FF8A3D;
        }
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0 60px;
        }
        form {
            background-color: #12181F;
            padding: 20px;
            width: 80%;
            max-width: 400px;
        }
        .field {
            width: 100%;
            text-align: center;
            margin: 10px 0;
            border: 2px solid #3DDCFF;
            box-shadow: 0 0 8px #3DDCFF, 0 0 16px rgba(61,220,255,0.5);
            border-radius: 5px;
        }
        input, textarea {
            width: 90%;
            padding: 10px;
            background-color: #12181F;
            color: #F5F1EA;
            border: none;
            box-shadow: none;
            border-radius: 5px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #FF8A3D;
            color: #F5F1EA;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #FF5722;
        }
        h1, p {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="cotiza.html" class="active">Cotiza tu pieza</a>
            <a href="contacto.html">Contacto</a>
        
            <a href="http://100.121.201.91/" target="_blank">Polish</a>
            <a href="tienda.html">Tienda en linea</a>
        </nav>
    </header>
    <div style="text-align:center; padding: 20px 20px 0;">
    <h1>¡Dale vida a tu idea!</h1>
    <p>Para una cotización precisa, súbete una imagen clara de la pieza que necesitas. También, indícanos las dimensiones aproximadas. ¡Así podemos evaluar el proyecto a la perfección!</p>
    </div>
    <div class="form-container">
        <form action="#" method="post">
            <div class="field">
                <input type="text" name="nombre" placeholder="Nombre" required>
            </div>
            <div class="field">
                <input type="text" name="tamano" placeholder="Tamaño de la pieza" required>
            </div>
            <div class="field">
                <input type="file" name="archivo" required>
            </div>
            <div class="field">
                <input type="email" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="field">
                <input type="tel" name="telefono" placeholder="Número de teléfono" required>
            </div>
            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotiza tu pieza - Shinny Printing Lab</title>
    <style>
        body {
            background-color: #12181F;
            color: #F5F1EA;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #12181F;
            padding: 10px 0;
        }
        nav a {
            color: #F5F1EA;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }
        nav a.active {
            color: #FF8A3D;
        }
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0 60px;
        }
        form {
            background-color: #12181F;
            padding: 20px;
            width: 80%;
            max-width: 400px;
        }
        .field {
            width: 100%;
            text-align: center;
            margin: 10px 0;
            border: 2px solid #3DDCFF;
            box-shadow: 0 0 8px #3DDCFF, 0 0 16px rgba(61,220,255,0.5);
            border-radius: 5px;
            position: relative;
            display: flex;
            align-items: center;
        }
        input, textarea, select {
            width: 90%;
            padding: 10px;
            background-color: #12181F;
            color: #F5F1EA;
            border: none;
            box-shadow: none;
            border-radius: 5px;
            appearance: none;
            background: none;
        }
        select {
            width: auto;
            margin-right: 5px;
        }
        input[name="telefono"] {
            flex: 1;
            width: auto;
            min-width: 0;
        }
        input::placeholder {
            color: #F5F1EA;
            opacity: 1;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #FF8A3D;
            color: #F5F1EA;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #FF5722;
        }
        h1 {
            margin-bottom: 20px; /* Aumentar el espacio debajo del h1 */
        }
        p {
            margin-top: 10px; /* Mantener el espacio arriba del p */
        }
        .error {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="cotiza.html" class="active">Cotiza tu pieza</a>
            <a href="contacto.html">Contacto</a>
            <a href="http://100.121.201.91/" target="_blank">Polish</a>
            <a href="tienda.html">Tienda en linea</a>
        </nav>
    </header>
    <div style="text-align:center; padding: 20px 20px 0;">
        <h1>¡Dale vida a tu idea!</h1>
        <p>Para una cotización precisa, súbete una imagen clara de la pieza que necesitas. También, indícanos las dimensiones aproximadas. ¡Así podemos evaluar el proyecto a la perfección!</p>
    </div>
    <div class="form-container">
        <form action="#" method="post" onsubmit="return validateForm()">
            <div class="field">
                <input type="text" name="nombre" placeholder="Nombre" required>
            </div>
            <div class="field">
                <input type="text" name="tamano" placeholder="Tamaño de la pieza" required>
            </div>
            <div class="field">
                <input type="file" name="archivo" accept=".stl,image/*" required>
                <div class="error" id="archivoError"></div>
            </div>
            <div class="field">
                <input type="email" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="field">
                <select name="pais_lada" onchange="updateLada()" data-lada="+52">
                    <option value="+52" data-lada="+52" selected>Mexico (+52)</option>
                    <option value="+1" data-lada="+1">Estados Unidos (+1)</option>
                    <option value="+1" data-lada="+1">Canada (+1)</option>
                    <option value="+57" data-lada="+57">Colombia (+57)</option>
                    <option value="+54" data-lada="+54">Argentina (+54)</option>
                    <option value="+34" data-lada="+34">España (+34)</option>
                </select>
                <span id="ladaDisplay">+52</span>
                <input type="tel" name="telefono" placeholder="10 dígitos, sin espacios" required>
                <div class="error" id="telefonoError"></div>
            </div>
            <button type="submit">Enviar</button>
        </form>
    </div>
    <script>
        function validateForm() {
            const archivoInput = document.querySelector('input[name="archivo"]');
            const telefonoInput = document.querySelector('input[name="telefono"]');
            const archivoError = document.getElementById('archivoError');
            const telefonoError = document.getElementById('telefonoError');
            let isValid = true;

            // Validación de archivo
            const file = archivoInput.files[0];
            if (file) {
                const extension = file.name.split('.').pop().toLowerCase();
                const validExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'stl'];
                if (!validExtensions.includes(extension)) {
                    archivoError.textContent = "Solo se aceptan imágenes o archivos .stl";
                    isValid = false;
                } else {
                    archivoError.textContent = "";
                }
            }

            // Validación de teléfono
            if (!/^\d{7,15}$/.test(telefonoInput.value)) {
                telefonoError.textContent = "Ingresa un número de teléfono válido";
                isValid = false;
            } else {
                telefonoError.textContent = "";
            }

            // Combinar lada y teléfono para enviar
            const paisLadaSelect = document.querySelector('select[name="pais_lada"]');
            const lada = paisLadaSelect.getAttribute('data-lada');
            telefonoInput.value = lada + telefonoInput.value;

            return isValid;
        }

        function updateLada() {
            const paisLadaSelect = document.querySelector('select[name="pais_lada"]');
            const ladaDisplay = document.getElementById('ladaDisplay');
            const selectedOption = paisLadaSelect.options[paisLadaSelect.selectedIndex];
            const lada = selectedOption.getAttribute('data-lada');
            ladaDisplay.textContent = lada;
            paisLadaSelect.setAttribute('data-lada', lada);
        }

        // Actualizar lada al cargar la página
        updateLada();
    </script>
</body>
</html>
